<!-- Explicit dark/light toggle in sidebar.
     `BookTheme` stays `auto`; this adds user override persisted in localStorage. -->
<button id="tds-theme-toggle" class="tds-theme-toggle" type="button" aria-label="Toggle dark and light mode">◐ Theme</button>
<script>
  (function () {
    var btn = document.getElementById("tds-theme-toggle");
    if (!btn) return;

    var getTheme = function () {
      var saved = localStorage.getItem("tds-theme");
      if (saved === "light" || saved === "dark") return saved;
      return "dark";
    };

    var applyTheme = function (theme) {
      document.documentElement.setAttribute("data-user-theme", theme);
      localStorage.setItem("tds-theme", theme);
      btn.textContent = theme === "dark" ? "☀ Light Mode" : "☾ Dark Mode";
    };

    applyTheme(getTheme());
    btn.addEventListener("click", function () {
      var now = document.documentElement.getAttribute("data-user-theme");
      applyTheme(now === "dark" ? "light" : "dark");
    });
  })();

  (function () {
    var normalize = function (p) {
      if (!p) return "/";
      p = p.split("#")[0].split("?")[0];
      if (p.length > 1 && p.endsWith("/")) p = p.slice(0, -1);
      return p || "/";
    };

    var current = normalize(window.location.pathname);
    document.querySelectorAll(".book-menu-content a[href]").forEach(function (a) {
      var href = a.getAttribute("href") || "";
      var url;
      try {
        url = new URL(href, window.location.origin);
      } catch (_e) {
        return;
      }
      if (url.origin !== window.location.origin) return;
      if (normalize(url.pathname) === current) {
        a.classList.add("active");
        a.setAttribute("aria-current", "page");
      }
    });
  })();

  /* Collapsible accordion for top-level sidebar sections.
     Targets <li><p><strong>…</strong></p><ul>…</ul></li> patterns only —
     the <p> wrapper is produced by markdown when a blank line precedes the
     nested list, which only happens for top-level sections. */
  (function () {
    var menu = document.querySelector(".book-menu-content");
    if (!menu) return;

    var sections = [];
    menu.querySelectorAll("li").forEach(function (li) {
      var p = li.firstElementChild;
      if (!p || p.tagName !== "P") return;
      var strong = p.firstElementChild;
      if (!strong || strong.tagName !== "STRONG" || p.children.length !== 1) return;
      var ul = li.querySelector(":scope > ul");
      if (!ul) return;
      sections.push({ li: li, p: p, ul: ul });
    });

    if (!sections.length) return;

    sections.forEach(function (s) {
      /* Wrap the child <ul> so we can apply a grid-row transition on the wrapper */
      var body = document.createElement("div");
      body.className = "tds-accordion-body";
      s.ul.parentNode.insertBefore(body, s.ul);
      body.appendChild(s.ul);

      /* Turn the <p> into a focusable button-like element */
      s.p.classList.add("tds-accordion-header");
      s.p.setAttribute("role", "button");
      s.p.setAttribute("tabindex", "0");

      /* Chevron indicator */
      var chevron = document.createElement("span");
      chevron.className = "tds-chevron";
      chevron.setAttribute("aria-hidden", "true");
      s.p.appendChild(chevron);

      /* Auto-expand the section that contains the current page */
      var open = !!s.ul.querySelector("a.active");
      applyState(s, open);

      s.p.addEventListener("click", function () { toggle(s); });
      s.p.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          toggle(s);
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          shiftFocus(sections, s, 1);
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          shiftFocus(sections, s, -1);
        }
      });
    });

    function applyState(s, open) {
      s.li.classList.toggle("tds-accordion-open", open);
      s.p.setAttribute("aria-expanded", open ? "true" : "false");
    }

    function toggle(s) {
      applyState(s, !s.li.classList.contains("tds-accordion-open"));
    }

    function shiftFocus(sections, current, dir) {
      var idx = sections.indexOf(current);
      var target = sections[idx + dir];
      if (target) target.p.focus();
    }
  })();
</script>
